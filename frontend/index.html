<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8" />
  <title>PixiJS + TypeScript</title>

  <style>
    @font-face {
      font-family: 'Birch Std';
      src: url('/assets/fonts/BirchStd.ttf') format('truetype');
      font-display: block;
    }
    @font-face {
      font-family: 'Forte';
      src: url('/assets/fonts/FORTE.TTF') format('truetype');
      font-display: block;
    }
    @font-face {
      font-family: 'Poppins';
      src: url('/assets/fonts/Poppins-SemiBold.ttf') format('truetype');
      font-weight: 600;
      font-display: block;
    }
    @font-face {
      font-family: 'Poppins';
      src: url('/assets/fonts/Poppins-Bold.ttf') format('truetype');
      font-weight: 700;
      font-display: block;
    }
    @font-face {
      font-family: 'Inter';
      src: url('/assets/fonts/Inter-Regular.ttf') format('truetype');
      font-weight: 400;
      font-display: block;
    }
    @font-face {
      font-family: 'Inter';
      src: url('/assets/fonts/Inter-Medium.ttf') format('truetype');
      font-weight: 500;
      font-display: block;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
    }

    canvas {
      display: block;
    }
  </style>
</head>

<body>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
